name: Build, Test, and Release

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags like v0.1.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: klap-linux-x86_64
          - os: macos-latest
            artifact: klap-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          koka -O2 -isrc src/klap.kk -o klap
          chmod +x klap

      - name: Build (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          koka -isrc src/klap.kk -o klap
          chmod +x klap

      - name: Test
        run: |
          koka -itests -isrc -e tests/test-klap.kk

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip klap

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force klap

      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz klap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true